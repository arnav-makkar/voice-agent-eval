[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarvam-voice-agent-improvement"
version = "0.2.0"
description = "Stateful evaluation, improvement, and release framework for Sarvam Voice Agents"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "certifi>=2025.0",
  "pydantic>=2.11,<3",
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
  "sarvam-conv-ai-sdk==1.0.21",
  "sarvamai==0.1.30",
]

[project.optional-dependencies]
experiments = [
  "gepa>=0.1.4,<0.2",
  "mlflow>=3.1,<4",
]

[project.scripts]
sarvam-instant-outbound = "sarvam_voice_agents.cli:main"
voice-improvement-framework = "framework.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sarvam_voice_agents*", "dataset*", "improvement*", "framework*"]
